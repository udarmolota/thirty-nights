<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e1220" />
    <title>30 Nights</title>
    <style>
      :root {
        --panel: #0e1220;
        --panel-2: #161c30;
        --line: #2a2f4a;
        --text: #dfe7f2;
        --muted: #8fa2c2;
        --accent: #ffb03a;
        --accent-2: #ffe08a;
        --danger: #ff2f4f;
        --good: #6fcf97;
        --sat: env(safe-area-inset-top, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #141a2e;
        color: var(--text);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 14px;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #top {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: calc(var(--sat) + 4px) calc(var(--sar) + 10px) 4px calc(var(--sal) + 10px);
        background: rgba(14, 18, 32, 0.92);
        border-bottom: 1px solid var(--line);
        pointer-events: none;
      }
      #top > * {
        pointer-events: auto;
      }
      #phase {
        font-weight: 600;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      #clock {
        font-variant-numeric: tabular-nums;
        font-size: 16px;
        font-weight: 600;
      }
      #light {
        color: var(--accent-2);
        white-space: nowrap;
        font-size: 12px;
      }
      #light.dark {
        color: var(--muted);
      }
      #res {
        display: flex;
        gap: 12px;
        margin-left: auto;
        margin-right: auto;
      }
      .resitem {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 44px;
        line-height: 1.1;
      }
      .resitem b {
        font-size: 15px;
        font-variant-numeric: tabular-nums;
      }
      .resitem span {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }
      .resitem.bad b {
        color: var(--danger);
      }
      #speeds {
        display: flex;
        gap: 4px;
      }
      #speeds button,
      .action,
      .chip,
      .card {
        box-sizing: border-box;
        font: 500 12px/1.3 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 4px;
        min-height: 28px;
        padding: 4px 8px;
        cursor: pointer;
      }
      #speeds button:enabled:hover,
      .action:enabled:hover,
      .chip:enabled:hover,
      .card:enabled:hover {
        border-color: var(--muted);
      }
      button:focus-visible {
        outline: 2px solid var(--accent-2);
        outline-offset: 2px;
      }
      #speeds button.active {
        background: #302a23;
        color: var(--accent-2);
        border-color: var(--accent);
        font-weight: 700;
      }
      #roster {
        position: fixed;
        left: calc(var(--sal) + 8px);
        bottom: calc(var(--sab) + 8px);
        display: flex;
        gap: 8px;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        width: 80px;
        padding: 4px;
        text-align: center;
      }
      .card img {
        width: 32px;
        height: 32px;
        object-fit: contain;
      }
      .card b {
        font-size: 13px;
      }
      .card span {
        font-size: 10px;
        color: var(--muted);
        line-height: 1.15;
      }
      .card.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .card.wounded b {
        color: var(--danger);
      }
      .hp {
        width: 100%;
        height: 5px;
        background: var(--line);
        border-radius: 3px;
        overflow: hidden;
      }
      .hp div {
        height: 100%;
        background: var(--good);
      }
      .card.wounded .hp div {
        background: var(--danger);
      }
      #sheet {
        position: fixed;
        right: calc(var(--sar) + 8px);
        top: calc(var(--sat) + 62px);
        width: 220px;
        max-height: calc(100% - var(--sat) - 130px);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 10px;
        background: rgba(14, 18, 32, 0.92);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      #sheet.empty {
        background: rgba(14, 18, 32, 0.6);
      }
      #sheet .title {
        font-weight: 700;
        font-size: 15px;
      }
      #sheet .sub {
        color: var(--muted);
        font-size: 12px;
      }
      #sheet .progress {
        color: var(--accent-2);
      }
      #sheet .hint {
        color: var(--muted);
        font-size: 12px;
      }
      #sheet .note {
        color: var(--accent-2);
        font-size: 12px;
        border-top: 1px solid var(--line);
        padding-top: 6px;
      }
      .action {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1px;
        min-height: 28px;
        justify-content: center;
        text-align: left;
      }
      .action b {
        font-size: 12px;
        font-weight: 600;
      }
      .action span {
        font-size: 11px;
        color: var(--muted);
      }
      .action.primary {
        background: #302a23;
        border-color: var(--accent);
        color: var(--accent-2);
      }
      .action.primary span {
        color: var(--muted);
      }
      .action:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .who {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .who .label {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .chip {
        min-height: 28px;
        font-size: 12px;
        padding: 4px 8px;
      }
      .chip.selected {
        border-color: var(--accent);
        background: #302a23;
        color: var(--accent-2);
        font-weight: 600;
      }
      .plan {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 4px;
        padding-top: 6px;
        border-top: 1px solid var(--line);
      }
      .estimate {
        color: var(--accent-2);
      }
      .estimate.bad {
        color: var(--bad, #e05a5a);
      }
      #toasts {
        position: fixed;
        top: calc(var(--sat) + 60px);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
        z-index: 5;
      }
      .toast {
        pointer-events: auto;
        background: rgba(14, 18, 32, 0.95);
        border: 1px solid var(--line);
        border-left: 4px solid var(--accent-2);
        border-radius: 4px;
        padding: 8px 14px;
        font-weight: 600;
        white-space: nowrap;
      }
      .toast.bad {
        border-left-color: var(--danger);
      }
      .toast.good {
        border-left-color: var(--good);
      }
      #modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        z-index: 10;
      }
      #modalbox {
        width: min(440px, 88vw);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #modalbox h2 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      #modalbox .p {
        color: var(--text);
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="top">
        <div id="phase"></div>
        <div id="clock"></div>
        <div id="light"></div>
        <div id="res"></div>
        <div id="speeds"></div>
      </div>
      <div id="roster"></div>
      <div id="sheet" class="empty"></div>
      <div id="toasts"></div>
      <div id="modal"><div id="modalbox"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
